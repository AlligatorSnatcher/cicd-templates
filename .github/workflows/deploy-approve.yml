# Reusable DEPLOY WITH APPROVAL — same as deploy.yml, but actor-gated.
#
# Use this for protected targets (e.g. prod):
#
#   * allowed_actors  — REQUIRED actor allow-list, enforced in YAML. Works on ANY
#                       plan (incl. free private repos). Restricts WHO can run the
#                       deploy. Soft control — a user with write access could edit
#                       this file — adequate for an internal team.
#   * allowed_ref     — optional: restrict to a single ref (e.g. refs/heads/release).
#
# (GitHub environment Required reviewers would be a stronger, un-editable gate,
# but they need a PAID plan on private repos — not used here.)
#
# TIMING: the gate runs at the START of this deploy job — if you call this after
# build/backup, those run before the gate. To block unauthorized runs BEFORE
# build, put an actor-gate job first in the caller instead.
#
# The artifact must already have been uploaded by the build workflow earlier in
# the SAME run. --exclude 'appsettings*.json' + no --delete: see deploy.yml.
#
name: Deploy with approval (rsync artifact)

on:
  workflow_call:
    inputs:
      host:
        description: "Target server to deploy to (IP or hostname)"
        type: string
        required: true
      folder:
        description: "App folder under /var to deploy into"
        type: string
        required: true
      runner_label:
        description: "Extra self-hosted runner label to target (e.g. dev / prod)"
        type: string
        required: true
      allowed_actors:
        description: "Space-separated GitHub logins allowed to deploy (actor gate)"
        type: string
        required: true
      allowed_ref:
        description: "Restrict to this ref, e.g. refs/heads/release (empty = any)"
        type: string
        required: false
        default: ""
      artifact:
        description: "Artifact name to download"
        type: string
        required: false
        default: "publish"

jobs:
  deploy:
    name: deploy -> ${{ inputs.host }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    steps:
      - name: Authorize (actor gate)
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          ALLOWED_ACTORS: ${{ inputs.allowed_actors }}
          ALLOWED_REF: ${{ inputs.allowed_ref }}
        run: |
          set -euo pipefail
          # Optional: restrict which ref may deploy.
          if [ -n "$ALLOWED_REF" ] && [ "$REF" != "$ALLOWED_REF" ]; then
            echo "::error::Deploy must run from '$ALLOWED_REF' (got '$REF')."
            exit 1
          fi
          # Actor allow-list.
          if [[ " $ALLOWED_ACTORS " != *" $ACTOR "* ]]; then
            echo "::error::'$ACTOR' is not authorized to deploy. Allowed: $ALLOWED_ACTORS."
            exit 1
          fi
          echo "Authorized: $ACTOR${ALLOWED_REF:+ (from $REF)}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: publish

      - name: Deploy — rsync to target server
        env:
          HOST: ${{ inputs.host }}
          FOLDER: ${{ inputs.folder }}
        run: |
          set -euo pipefail
          echo "Deploying $GITHUB_WORKSPACE/publish/ -> root@$HOST:/var/$FOLDER/"
          rsync -ptvrz --exclude 'appsettings*.json' \
            "$GITHUB_WORKSPACE/publish/" "root@$HOST:/var/$FOLDER/"
          echo "Deploy complete."
