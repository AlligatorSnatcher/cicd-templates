# Reusable RESTORE — rsync a chosen backup back to root@<host>:/var/<folder>/.
#
# Generic building block; the counterpart to backup.yml. Triggered via a thin
# workflow_dispatch caller in the app repo (reusable workflows can't be
# dispatched directly), which forwards the inputs below.
#
# Restores CODE ONLY: appsettings*.json are excluded so a rollback keeps the
# server's current config. No --delete, so files the server gained since the
# backup are left in place.
#
# WRITES TO THE LIVE SERVER. Optional typed-confirmation gate: if `confirm` is
# given it must equal `folder`; leave it empty to skip the gate. Reads backups
# from $BACKUP_DEST (inherited from the runner env).
#
# AUTHORIZATION is NOT done here — this is a pure restore action. If a target
# (e.g. prod) needs an actor/ref gate, the caller puts an `authorize` job in
# front of this one (see authorize.yml). dev callers can skip the gate entirely.
#
# Optional `service`: if set, `systemctl restart` over ssh after the restore so
# the rolled-back code actually takes effect, verified with `is-active`. Empty =
# files only, no restart (mirrors deploy.yml).
#
# Optional `delay_seconds`: wait this long BEFORE restoring. For rolling restores
# (multi-host), call this workflow once per host in sequence (`needs:`) and give
# the later host(s) a delay so each is touched only after the previous is back up.
#
# Pick the backup via `backup`: "latest" or a specific "<stamp>-<run_id>" dir
# name (the step prints what's on disk).
#
name: Restore (rsync from backup)

on:
  workflow_call:
    inputs:
      host:
        description: "Target server to restore to (IP or hostname)"
        type: string
        required: true
      folder:
        description: "App folder under /var to restore"
        type: string
        required: true
      backup:
        description: 'Which backup: "latest", a deploy run_id, or a full <stamp>-<run_id> dir'
        type: string
        required: true
      confirm:
        description: "Optional typed-confirmation: if set, must equal `folder`; empty = no gate"
        type: string
        required: false
        default: ""
      runner_label:
        description: "Extra self-hosted runner label to target (must match the env)"
        type: string
        required: true
      service:
        description: "systemd unit to restart after restore (empty = no restart)"
        type: string
        required: false
        default: ""
      delay_seconds:
        description: "Seconds to wait BEFORE starting (rolling restores; 0 = no wait)"
        type: string
        required: false
        default: "0"

concurrency:
  group: restore-${{ inputs.folder }}
  cancel-in-progress: false

jobs:
  restore:
    name: restore ${{ inputs.folder }} <- ${{ inputs.backup }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    steps:
      - name: Wait before restore (rolling)
        # Space out hosts in a rolling restore: the 2nd host waits for the 1st to
        # finish + this delay before it's touched. 0 = restore immediately.
        if: inputs.delay_seconds != '0' && inputs.delay_seconds != ''
        env:
          DELAY: ${{ inputs.delay_seconds }}
        run: |
          set -euo pipefail
          echo "Waiting ${DELAY}s before restoring ${{ inputs.host }}…"
          sleep "$DELAY"

      - name: Restore from backup
        env:
          HOST: ${{ inputs.host }}
          FOLDER: ${{ inputs.folder }}
          BACKUP: ${{ inputs.backup }}
          CONFIRM: ${{ inputs.confirm }}
          # BACKUP_DEST inherited from the runner container's env, not set here.
        run: |
          set -euo pipefail
          : "${HOST:?host input is empty — set the target server repo var before running}"
          ROOT="${BACKUP_DEST:?Set repo variable BACKUP_DEST to the mounted host path (e.g. /codebkp)}"
          DEST_ROOT="$ROOT/$FOLDER"

          echo "Available backups under $DEST_ROOT:"
          ls -1dt "$DEST_ROOT"/*/ 2>/dev/null || { echo "  (none found)"; exit 1; }

          # Optional safety gate: when a confirm value is given it must match the
          # folder name. Empty = no gate (caller relies on a front authorize job).
          if [ -n "$CONFIRM" ] && [ "$CONFIRM" != "$FOLDER" ]; then
            echo "Confirmation mismatch: type the folder name '$FOLDER' in the confirm box to proceed."
            exit 1
          fi

          if [ "$BACKUP" = "latest" ]; then
            SRC="$(ls -1dt "$DEST_ROOT"/*/ 2>/dev/null | head -n1)"
          elif [ -d "$DEST_ROOT/$BACKUP" ]; then
            # Full "<stamp>-<run_id>" dir name passed verbatim.
            SRC="$DEST_ROOT/$BACKUP/"
          else
            # Treat as a deploy run_id: match the "<stamp>-<run_id>" dir.
            SRC="$(ls -1dt "$DEST_ROOT"/*-"$BACKUP"/ 2>/dev/null | head -n1)"
          fi
          if [ -z "${SRC:-}" ] || [ ! -d "$SRC" ]; then
            echo "Backup not found: '$BACKUP'"
            exit 1
          fi

          echo "Restoring $SRC -> root@$HOST:/var/$FOLDER/"
          # Exclude config so a rollback keeps the server's CURRENT appsettings.
          rsync -ptvrz --exclude 'appsettings*.json' "$SRC" "root@$HOST:/var/$FOLDER/"
          echo "Restore complete from: $SRC"

      - name: Restart service
        # Activate the rolled-back code. Skipped when no service is given.
        if: inputs.service != ''
        env:
          HOST: ${{ inputs.host }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          : "${HOST:?host input is empty}"
          echo "Restarting '$SERVICE' on root@$HOST"
          # is-active makes a failed start fail the restore (not a silent no-op).
          ssh "root@$HOST" "systemctl restart '$SERVICE' && systemctl is-active '$SERVICE'"
          echo "'$SERVICE' is active."
