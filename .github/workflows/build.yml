# Reusable BUILD — dotnet publish a project -> upload artifact.
#
# Generic building block. Call it from an app repo via `uses:`. All project- and
# environment-specific values come in as inputs; nothing is hardcoded here.
#
# ASSUMES: the target runner has the .NET SDK available (e.g. the org's
# dotnet-runner image). Jobs run directly on the runner (no `container:`).
#
# SECRETS: the artifact EXCLUDES appsettings*.json so config never leaves the
# network into GitHub artifact storage; the server keeps its own config.
#
# TRANSPORT — two ways to hand the build off to deploy:
#   * artifact (default): upload-artifact, downloaded by deploy. Portable, but
#     round-trips through GitHub artifact storage (slow on a constrained link).
#   * stage (`stage: true`): rsync the publish into a per-run dir on a host volume
#     mounted into the runner ($PUBLISH_DEST/<artifact>/<run_id>/); deploy reads
#     it from there. Stays on the LAN — far faster when the artifact link is the
#     bottleneck. Requires the SAME $PUBLISH_DEST visible to build AND deploy
#     runners (single runner host, or a shared mount), like BACKUP_DEST.
#
name: Build (dotnet publish)

on:
  workflow_call:
    inputs:
      project:
        description: "Path to the .csproj to publish (e.g. src/App/App.csproj)"
        type: string
        required: true
      runner_label:
        description: "Extra self-hosted runner label to target (e.g. dev / prod)"
        type: string
        required: true
      config:
        description: "Build configuration (Debug / Release)"
        type: string
        required: false
        default: "Debug"
      artifact:
        description: "Artifact name to upload (also the per-run subdir under $PUBLISH_DEST in stage mode)"
        type: string
        required: false
        default: "publish"
      stage:
        description: "true = rsync publish to $PUBLISH_DEST host volume instead of upload-artifact"
        type: string
        required: false
        default: "false"

jobs:
  build:
    name: build (${{ inputs.config }})
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build — dotnet publish
        env:
          PROJECT: ${{ inputs.project }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          dotnet --info | head -n 5 || true
          rm -rf "$GITHUB_WORKSPACE/publish"
          dotnet publish "$PROJECT" -c "$CONFIG" -o "$GITHUB_WORKSPACE/publish"
          echo "Published $CONFIG -> $GITHUB_WORKSPACE/publish"

      - name: Upload build artifact (excludes appsettings*.json)
        if: inputs.stage != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          # Exclude config so secrets never reach GitHub artifact storage.
          path: |
            publish
            !publish/appsettings*.json
          retention-days: 3
          if-no-files-found: error

      - name: Stage publish to host volume (LAN handoff)
        # Alternative to artifacts: drop the publish into a per-run dir on a
        # mounted host volume that deploy reads from — no GitHub artifact storage.
        if: inputs.stage == 'true'
        env:
          ARTIFACT: ${{ inputs.artifact }}
          KEEP: "5"
          # PUBLISH_DEST inherited from the runner container's env (like BACKUP_DEST).
        run: |
          set -euo pipefail
          ROOT="${PUBLISH_DEST:?Set PUBLISH_DEST (mounted host path) on the runner to use stage mode}"
          BASE="$ROOT/$ARTIFACT"
          OUT="$BASE/$GITHUB_RUN_ID"
          # Newest existing per-run dir (computed BEFORE creating OUT) — unchanged
          # files are hardlinked from it via --link-dest, so a fresh per-run dir
          # costs ~an incremental copy, not a full one. Skipped on the first run.
          PREV="$(ls -1dt "$BASE"/*/ 2>/dev/null | head -n1 || true)"
          LINK=()
          [ -n "$PREV" ] && LINK=(--link-dest="$PREV")
          rm -rf "$OUT"
          mkdir -p "$OUT"
          # Exclude config so it never leaves the box; --delete keeps the dir clean.
          rsync -a --delete "${LINK[@]}" --exclude 'appsettings*.json' "$GITHUB_WORKSPACE/publish/" "$OUT/"
          echo "Staged -> $OUT${PREV:+ (hardlinked unchanged files from $PREV)}"
          # Prune to the newest $KEEP per-run dirs for this artifact.
          ls -1dt "$BASE"/*/ 2>/dev/null | tail -n +"$((KEEP + 1))" | while read -r old; do
            echo "Pruning old staged build: $old"
            rm -rf "$old"
          done
