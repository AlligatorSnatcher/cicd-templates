# Reusable AUTHORIZE — front gate for protected pipelines (e.g. prod).
#
# Put this FIRST in the caller and make build/backup/deploy `needs: authorize`,
# so an unauthorized / wrong-branch run is stopped BEFORE it builds or snapshots
# anything. Pair it with the plain deploy.yml (the gate is up front, so the
# deploy step itself doesn't need to re-check).
#
# Checks at the very start of the run:
#   * allowed_ref     — optional: run must come from this ref (e.g. release).
#   * allowed_actors  — REQUIRED actor allow-list (space-separated logins).
#                       Works on ANY plan. Soft control — editable by anyone with
#                       write access — adequate for an internal team.
#
# This gate is AUTHORIZATION only (who / which ref). Config validation — e.g.
# "is PROD_HOST set?" — belongs to the building blocks that consume it: backup /
# deploy / restore each fail fast on an empty host input.
#
name: Authorize (front gate)

on:
  workflow_call:
    inputs:
      allowed_actors:
        description: "Space-separated GitHub logins allowed to run (actor gate)"
        type: string
        required: true
      allowed_ref:
        description: "Restrict to this ref, e.g. refs/heads/release (empty = any)"
        type: string
        required: false
        default: ""
      runner_label:
        description: "Extra self-hosted runner label to target (e.g. dev / prod)"
        type: string
        required: true

jobs:
  authorize:
    name: authorize
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    steps:
      - name: Authorize (ref + actor)
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          ALLOWED_ACTORS: ${{ inputs.allowed_actors }}
          ALLOWED_REF: ${{ inputs.allowed_ref }}
        run: |
          set -euo pipefail
          # Optional: restrict which ref may run.
          if [ -n "$ALLOWED_REF" ] && [ "$REF" != "$ALLOWED_REF" ]; then
            echo "::error::Must run from '$ALLOWED_REF' (got '$REF')."
            exit 1
          fi
          # Actor allow-list.
          if [[ " $ALLOWED_ACTORS " != *" $ACTOR "* ]]; then
            echo "::error::'$ACTOR' is not authorized. Allowed: $ALLOWED_ACTORS."
            exit 1
          fi
          echo "Authorized: $ACTOR${ALLOWED_REF:+ (from $REF)}"
