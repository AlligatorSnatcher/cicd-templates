# Reusable DEPLOY — rsync a built artifact onto root@<host>:/var/<folder>/.
#
# Generic building block, NO approval gate. For a gated pipeline (e.g. prod),
# run authorize.yml as the first job and make build/backup/deploy `needs` it, so
# an unauthorized run is stopped before it builds or snapshots anything.
#
# The artifact must already have been uploaded by the build workflow earlier in
# the SAME run (artifacts are shared across reusable jobs within one run).
# host/folder are required inputs — nothing is hardcoded.
#
# --exclude 'appsettings*.json' + no --delete: overwrites/adds files but keeps
# the server's own config and never removes files the server has gained.
#
# Optional `service`: if set, the new code is activated by `systemctl restart`
# over ssh after the rsync, then verified with `is-active` (a service that fails
# to come back up fails the deploy). Empty = rsync only, no restart.
#
# Optional `delay_seconds`: wait this long BEFORE deploying. For rolling deploys,
# call this workflow once per host in sequence (`needs:`) and give the later
# host(s) a delay so each is touched only after the previous one is back up.
#
# TRANSPORT (`stage`): must match the build job. Default reads the GitHub
# artifact; `stage: true` reads the publish from $PUBLISH_DEST/<artifact>/<run_id>/
# on the mounted host volume (no artifact download) — see build.yml.
#
name: Deploy (rsync artifact)

on:
  workflow_call:
    inputs:
      host:
        description: "Target server to deploy to (IP or hostname)"
        type: string
        required: true
      folder:
        description: "App folder under /var to deploy into"
        type: string
        required: true
      runner_label:
        description: "Extra self-hosted runner label to target (e.g. dev / prod)"
        type: string
        required: true
      artifact:
        description: "Artifact name to download"
        type: string
        required: false
        default: "publish"
      service:
        description: "systemd unit to restart after deploy (empty = no restart)"
        type: string
        required: false
        default: ""
      delay_seconds:
        description: "Seconds to wait BEFORE starting (rolling deploys; 0 = no wait)"
        type: string
        required: false
        default: "0"
      stage:
        description: "true = read publish from $PUBLISH_DEST host volume instead of artifact (match build)"
        type: string
        required: false
        default: "false"

jobs:
  deploy:
    name: deploy -> ${{ inputs.host }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    steps:
      - name: Wait before deploy (rolling)
        # Space out hosts in a rolling deploy: the 2nd host waits for the 1st to
        # finish + this delay before it's touched. 0 = deploy immediately.
        if: inputs.delay_seconds != '0' && inputs.delay_seconds != ''
        env:
          DELAY: ${{ inputs.delay_seconds }}
        run: |
          set -euo pipefail
          echo "Waiting ${DELAY}s before deploying ${{ inputs.host }}…"
          sleep "$DELAY"

      - name: Download build artifact
        if: inputs.stage != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: publish

      - name: Deploy — rsync to target server
        env:
          HOST: ${{ inputs.host }}
          FOLDER: ${{ inputs.folder }}
          ARTIFACT: ${{ inputs.artifact }}
          STAGE: ${{ inputs.stage }}
          # PUBLISH_DEST inherited from the runner container's env (stage mode only).
        run: |
          set -euo pipefail
          : "${HOST:?host input is empty — set the target server repo var before running}"
          if [ "$STAGE" = "true" ]; then
            ROOT="${PUBLISH_DEST:?Set PUBLISH_DEST (mounted host path) on the runner to use stage mode}"
            SRC="$ROOT/$ARTIFACT/$GITHUB_RUN_ID/"
            [ -d "$SRC" ] || { echo "::error::Staged build not found: $SRC (did build run with stage: true?)"; exit 1; }
          else
            SRC="$GITHUB_WORKSPACE/publish/"
          fi
          echo "Deploying $SRC -> root@$HOST:/var/$FOLDER/"
          rsync -ptvrz --exclude 'appsettings*.json' "$SRC" "root@$HOST:/var/$FOLDER/"
          echo "Deploy complete."

      - name: Restart service
        # Activate the new code. Skipped when no service is given.
        if: inputs.service != ''
        env:
          HOST: ${{ inputs.host }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          : "${HOST:?host input is empty}"
          echo "Restarting '$SERVICE' on root@$HOST"
          # is-active makes a failed start fail the deploy (not a silent no-op).
          ssh "root@$HOST" "systemctl restart '$SERVICE' && systemctl is-active '$SERVICE'"
          echo "'$SERVICE' is active."
